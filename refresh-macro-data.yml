name: Refresh Macro Data

# Runs automatically once a day, AND gives you a manual "Run workflow"
# button in the Actions tab whenever you want to force an immediate
# refresh. Everything here runs on GitHub's own servers — nothing to
# install locally.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — edit this line + re-save to change the time
  workflow_dispatch: {}    # adds the manual "Run workflow" button

permissions:
  contents: write   # lets the workflow commit the refreshed data file back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-macro-data.mjs

      - name: Commit updated data (only if it changed)
        run: |
          git config user.name "macro-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro-data.json
          git diff --cached --quiet && echo "No changes — skipping commit" || git commit -m "Refresh macro data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
